plugins {
    id 'com.android.application'
}

// In GitHub Actions: numarul build-ului da versiunea, iar cheia fixa vine din Secrets.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def keystore = System.getenv('SIGNING_KEYSTORE')

android {
    namespace 'ro.faicu.vwwelcome'
    compileSdk 34

    defaultConfig {
        // Numele unei aplicatii de pe listele FYT (unkill_app.txt din com.syu.ms si
        // LaunchWhiteList din /oem/app/pwctl_config.xml), neinstalata pe navigatie: asa
        // MainServer nu ne mai inchide la somn si avem voie la autostart. Vezi CLAUDE.md.
        applicationId 'com.mapgoo.diruite'
        minSdk 26
        targetSdk 33
        versionCode buildNumber
        versionName "1.1.${buildNumber}"
        // Cheia pentru status.faicu.ro/api/vw-log, din secretul VW_LOG_TOKEN al repo-ului.
        // Fara ea, trimiterea jurnalului e dezactivata.
        buildConfigField "String", "VW_LOG_TOKEN", "\"${System.getenv('VW_LOG_TOKEN') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (keystore) {
            fixed {
                storeFile file(keystore)
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'vwwelcome'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Aceeasi cheie la fiecare build, ca APK-ul nou sa se instaleze peste cel vechi.
            if (keystore) signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
