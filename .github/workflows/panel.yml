name: Build FaikkitCar Panel

# Aplicatia de telefon: workflow separat, cu numaratoarea lui de build-uri, ca o schimbare
# in Panel sa nu faca o versiune noua a aplicatiei din masina (si invers).
# Panel se distribuie doar prin Google Play (testare interna): AAB-ul semnat cu cheia de incarcare
# se trimite pe track-ul `internal`, iar telefonul il actualizeaza din Play.
on:
  push:
    paths:
      - 'panel/**'
      - '.github/workflows/panel.yml'
      - 'settings.gradle'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # Verificare ca se compileaza (si pe ramuri, fara secrete).
      - run: gradle :panel:assembleDebug
      # Secrete: UPLOAD_KEYSTORE_BASE64, UPLOAD_PASSWORD, UPLOAD_ALIAS, PLAY_SERVICE_ACCOUNT_JSON.
      - name: Build Play bundle
        id: play
        if: github.ref == 'refs/heads/main'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
          UPLOAD_ALIAS: ${{ secrets.UPLOAD_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::Secretele pentru Google Play lipsesc, AAB-ul nu se construieste"; exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" gradle :panel:bundleRelease
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Upload to Google Play (internal testing)
        if: steps.play.outputs.ok == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ro.faicu.faikkitcar.panel
          releaseFiles: panel/build/outputs/bundle/release/panel-release.aab
          track: internal
          status: completed
      - uses: actions/upload-artifact@v4
        if: steps.play.outputs.ok == '1'
        with:
          name: faikkitcar-panel-aab
          path: panel/build/outputs/bundle/release/panel-release.aab
