name: Build FaikkitCar

on:
  push:
    # Site-ul (web/) și documentația nu schimbă APK-ul: nu facem o versiune nouă pentru ele.
    paths-ignore:
      - 'web/**'
      - 'deploy/**'
      - 'panel/**'
      - '.github/workflows/panel.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vwwelcome.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/vwwelcome.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secretul KEYSTORE_BASE64 lipseste: APK-ul e semnat cu o cheie de debug temporara si nu se va putea instala peste versiunea anterioara."
          fi
      - run: gradle :app:assembleDebug
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VW_LOG_TOKEN: ${{ secrets.VW_LOG_TOKEN }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk FaikkitCar.apk
      # Actualizarea din aplicatie ia APK-ul de pe car.faicu.ro (/api/car/apk).
      - name: Publish APK to car.faicu.ro
        if: github.ref == 'refs/heads/main'
        env:
          VW_LOG_TOKEN: ${{ secrets.VW_LOG_TOKEN }}
        run: |
          if [ -z "$VW_LOG_TOKEN" ]; then echo "::warning::VW_LOG_TOKEN lipseste, APK-ul nu e publicat"; exit 0; fi
          publish() {
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $VW_LOG_TOKEN" \
              -H "X-Version-Code: ${{ github.run_number }}" \
              -H "X-Version-Name: 1.1.${{ github.run_number }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @FaikkitCar.apk "$1"
          }
          publish https://car.faicu.ro/api/car/apk || echo "::warning::Publicarea pe car.faicu.ro a esuat"
      - uses: actions/upload-artifact@v4
        with:
          name: faikkitcar-apk
          path: FaikkitCar.apk
      # Fiecare build devine un release nou, marcat "latest", deci linkul
      # releases/latest/download/FaikkitCar.apk arata mereu ultimul APK.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FaikkitCar build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "APK de debug construit din ${{ github.ref_name }} @ ${{ github.sha }}."
          make_latest: true
          files: FaikkitCar.apk
