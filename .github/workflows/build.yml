name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vwwelcome.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/vwwelcome.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secretul KEYSTORE_BASE64 lipseste: APK-ul e semnat cu o cheie de debug temporara si nu se va putea instala peste versiunea anterioara."
          fi
      - run: gradle assembleDebug
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk VWWelcome.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vw-welcome-apk
          path: VWWelcome.apk
      # Fiecare build devine un release nou, marcat "latest", deci linkul
      # releases/latest/download/VWWelcome.apk arata mereu ultimul APK.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VW Welcome build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "APK de debug construit din ${{ github.ref_name }} @ ${{ github.sha }}."
          make_latest: true
          files: VWWelcome.apk
