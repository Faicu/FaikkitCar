plugins {
    id 'com.android.application'
}

// Ca la aplicatia din masina: numarul build-ului din GitHub Actions si aceeasi cheie fixa.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def keystore = System.getenv('SIGNING_KEYSTORE')
// Cheia de incarcare pentru Google Play (Play App Signing semneaza el cu cheia finala).
def uploadKeystore = System.getenv('UPLOAD_KEYSTORE')

android {
    namespace 'ro.faicu.faikkitcar.panel'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.faicu.faikkitcar.panel'
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // github = APK cu actualizare proprie (car.faicu.ro); play = AAB pentru Google Play, fara Updater.
    flavorDimensions 'dist'
    productFlavors {
        github { dimension 'dist'; buildConfigField 'boolean', 'PLAY', 'false' }
        play { dimension 'dist'; buildConfigField 'boolean', 'PLAY', 'true' }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (keystore) {
            fixed {
                storeFile file(keystore)
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'vwwelcome'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv('UPLOAD_PASSWORD')
                keyAlias System.getenv('UPLOAD_ALIAS') ?: 'upload'
                keyPassword System.getenv('UPLOAD_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (keystore) signingConfig signingConfigs.fixed
        }
        release {
            if (uploadKeystore) signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Harta (OpenStreetMap), fara cheie Google.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
