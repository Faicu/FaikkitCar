plugins {
    id 'com.android.application'
}

// Numarul build-ului din GitHub Actions. Panel se distribuie doar prin Google Play (testare interna):
// AAB semnat cu cheia de incarcare, trimis de panel.yml; Google semneaza cu cheia finala.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def uploadKeystore = System.getenv('UPLOAD_KEYSTORE')

android {
    namespace 'ro.faicu.faikkitcar.panel'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.faicu.faikkitcar.panel'
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv('UPLOAD_PASSWORD')
                keyAlias System.getenv('UPLOAD_ALIAS') ?: 'faikkitcar-upload'
                keyPassword System.getenv('UPLOAD_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (uploadKeystore) signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Harta (OpenStreetMap), fara cheie Google.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
